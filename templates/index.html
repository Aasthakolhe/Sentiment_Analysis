<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context & Confidence-Aware Sentiment Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 40px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 12px; padding: 30px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        textarea { width: 100%; height: 90px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-size: 16px; box-sizing: border-box; resize: none; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        .result-box { margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 8px; display: none; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .Positive { background: #15803d; color: #bbf7d0; }
        .Negative { background: #b91c1c; color: #fecaca; }
        .Neutral { background: #334155; color: #e2e8f0; }
        .Mixed { background: #b45309; color: #fef08a; }
        .warning-box { background: #7c2d12; border-left: 4px solid #f97316; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 14px; color: #ffedd5; }
        .confidence-bar { background: #334155; border-radius: 10px; height: 12px; width: 100%; margin-top: 8px; overflow: hidden; }
        .confidence-fill { background: #38bdf8; height: 100%; width: 0%; transition: width 0.5s ease; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Context & Confidence Dashboard</h2>
        <textarea id="inputText" placeholder="Type feedback e.g., 'I\'m dead 💀', 'you ate', 'that\'s sick 🔥'..."></textarea>
        <button onclick="analyzeSentiment()">Analyze Sentiment</button>

        <div id="resultBox" class="result-box">
            <p><strong>Predicted Sentiment:</strong> <span id="sentimentBadge" class="badge">--</span></p>
            <p><strong>Confidence Score:</strong> <span id="confidenceScore">0%</span></p>
            <div class="confidence-bar"><div id="confidenceFill" class="confidence-fill"></div></div>
            <p style="font-size: 13px; color: #94a3b8; margin-top: 12px;"><strong>Context Tokens:</strong> <span id="cleanText">--</span></p>
            <div id="warningBox" class="warning-box" style="display:none;"></div>
        </div>
    </div>

    <script>
        async function analyzeSentiment() {
            const text = document.getElementById('inputText').value;
            if (!text) return;

            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();

            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('cleanText').innerText = data.preprocessed_text;
            
            const badge = document.getElementById('sentimentBadge');
            badge.innerText = data.predicted_sentiment;
            badge.className = 'badge ' + data.predicted_sentiment;

            document.getElementById('confidenceScore').innerText = data.confidence_score;
            document.getElementById('confidenceFill').style.width = data.confidence_score;

            const warningBox = document.getElementById('warningBox');
            if (data.is_uncertain) {
                warningBox.style.display = 'block';
                warningBox.innerText = data.uncertainty_warning;
            } else {
                warningBox.style.display = 'none';
            }
        }
    </script>
</body>
</html>
